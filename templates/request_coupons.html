<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Your Food Coupons</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #ff8a00, #e52e71); min-height: 100vh; padding: 20px 0; }
        .card { max-width: 460px; width: 100%; margin: auto; border-radius: 18px; border: none; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
        .card-body { padding: 2rem; }
        .coupon-mini { border: 1px dashed #adb5bd; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; text-align: center; }
        .coupon-mini img { width: 140px; height: 140px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-body">
            <div id="loading" class="text-center text-muted">Loading session details...</div>

            <div id="formSection" class="d-none">
                <div class="text-center mb-3">
                    <div style="font-size:2rem;">🍽️</div>
                    <h5 class="fw-bold mt-1" id="sessionName"></h5>
                    <p class="text-muted mb-0" id="sessionMeta"></p>
                    <p class="small text-muted" id="remainingInfo"></p>
                </div>

                <div id="errorBox" class="alert alert-danger d-none"></div>

                <div class="mb-3">
                    <label class="form-label">Your Name (optional)</label>
                    <input type="text" class="form-control" id="requesterName" placeholder="e.g. Sharma Family">
                </div>
                <div class="mb-3">
                    <label class="form-label">Number of Coupons Needed</label>
                    <input type="number" class="form-control" id="count" min="1" placeholder="e.g. 3" required>
                </div>
                <button class="btn btn-primary w-100 fw-semibold" id="submitBtn">Get Coupons</button>
            </div>

            <div id="resultSection" class="d-none">
                <h6 class="fw-bold mb-3 text-center">✅ Here are your coupons</h6>
                <div id="couponsList"></div>
                <p class="small text-muted text-center">Screenshot or bookmark this page — show each QR code at the food counter.</p>
            </div>
        </div>
    </div>

    <script>
        const sessionId = window.location.pathname.split('/').pop();

        async function loadSession() {
            const res = await fetch(`/api/sessions/${sessionId}/public`);
            const data = await res.json();
            document.getElementById('loading').classList.add('d-none');

            if (!data.success) {
                document.getElementById('loading').textContent = 'Session not found.';
                document.getElementById('loading').classList.remove('d-none');
                return;
            }

            const s = data.session;
            document.getElementById('sessionName').textContent = s.session_name;
            document.getElementById('sessionMeta').textContent = `${s.session_date} · ${s.food_item || ''}`;
            document.getElementById('remainingInfo').textContent = `${s.remaining} of ${s.attendee_count} coupons remaining`;
            document.getElementById('formSection').classList.remove('d-none');
        }

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const errorBox = document.getElementById('errorBox');
            errorBox.classList.add('d-none');
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Submitting...';

            const payload = {
                requester_name: document.getElementById('requesterName').value.trim(),
                count: document.getElementById('count').value
            };

            try {
                const res = await fetch(`/api/coupons/request/${sessionId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (!data.success) {
                    errorBox.textContent = data.message;
                    errorBox.classList.remove('d-none');
                    btn.disabled = false;
                    btn.textContent = 'Get Coupons';
                    return;
                }

                document.getElementById('formSection').classList.add('d-none');
                document.getElementById('resultSection').classList.remove('d-none');

                document.getElementById('couponsList').innerHTML = data.coupons.map(c => `
                    <div class="coupon-mini">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${encodeURIComponent(c.secure_token)}" alt="QR">
                        <div class="fw-bold mt-2">${c.coupon_code}</div>
                        <a href="/coupon/${c.secure_token}" class="small">Open full coupon page</a>
                    </div>
                `).join('');
            } catch (err) {
                errorBox.textContent = 'Something went wrong. Please try again.';
                errorBox.classList.remove('d-none');
                btn.disabled = false;
                btn.textContent = 'Get Coupons';
            }
        });

        loadSession();
    </script>
</body>
</html>
